name: georisk-infra

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: georisk-db
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=georisk_pass
      - POSTGRES_DB=georisk_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: